<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karibik Saison</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⛵ Karibik Saison</h1>
            <div class="controls">
                <button id="createPath" class="btn btn-primary">➕ Create Path</button>
                <button id="zoomIn" class="btn">🔍+ Zoom In</button>
                <button id="zoomOut" class="btn">🔍- Zoom Out</button>
                <button id="reset" class="btn">↺ Reset View</button>                <button id="clearAll" class="btn btn-danger">🗑️ Clear All</button>            </div>
        </div>
        
        <!-- Map Container -->
        <div id="map"></div>
        
        <!-- Path Creation Modal -->
        <div id="pathModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Create New Sailing Path</h2>
                <form id="pathForm">
                    <div class="form-group">
                        <label>Path Title</label>
                        <input type="text" id="pathTitle" required placeholder="e.g., Caribbean Adventure">
                    </div>
                    <div class="form-group">
                        <label>Start Date</label>
                        <input type="date" id="startDate" required>
                    </div>
                    <div class="form-group">
                        <label>End Date</label>
                        <input type="date" id="endDate" required>
                    </div>
                    <div class="form-group">
                        <label>Skipper</label>
                        <input type="text" id="skipper" required placeholder="Skipper name">
                    </div>
                    <div class="form-group">
                        <label>Wachführer</label>
                        <div id="wachtfuehrerList" class="dynamic-list"></div>
                        <button type="button" id="addWachtfuehrer" class="btn btn-small">+ Add Wachführer</button>
                    </div>
                    <div class="form-group">
                        <label>Crew</label>
                        <div id="crewList" class="dynamic-list"></div>
                        <button type="button" id="addCrew" class="btn btn-small">+ Add Crew Member</button>
                    </div>
                    <div class="form-group">
                        <label>Path Color</label>
                        <input type="color" id="pathColor" value="#FF6B6B">
                    </div>
                    <p class="info-text">Click on the map to select start and end points.</p>
                    <button type="submit" class="btn btn-primary">Save Path</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    
    <!-- Firebase SDK (CDN - global scope) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>
    
    <!-- Firebase Initialization (inlined) -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBUVBsn2DOvsfzfBH-xLSpiwA9Xnuslvik",
            authDomain: "karibik-saison.firebaseapp.com",
            databaseURL: "https://karibik-saison-default-rtdb.firebaseio.com",
            projectId: "karibik-saison",
            storageBucket: "karibik-saison.firebasestorage.app",
            messagingSenderId: "95625990195",
            appId: "1:95625990195:web:58c986f2298cfa0f9e9346"
        };
        
        // Wait for Firebase SDK then initialize
        let retries = 0;
        function initFirebase() {
            if (typeof firebase !== 'undefined') {
                firebase.initializeApp(firebaseConfig);
                const database = firebase.database();
                window.firebase = {
                    database: () => database,
                    ref: (path) => firebase.database().ref(path),
                    get: (ref) => ref.once('value'),
                    set: (ref, data) => ref.set(data),
                    remove: (ref) => ref.remove(),
                    onValue: (ref, callback) => ref.on('value', callback),
                    onChildAdded: (ref, callback) => ref.on('child_added', callback),
                    onChildRemoved: (ref, callback) => ref.on('child_removed', callback),
                    onChildChanged: (ref, callback) => ref.on('child_changed', callback)
                };
                console.log('✅ Firebase initialized - Shared collaborative map ready!');
            } else if (retries < 50) {
                retries++;
                setTimeout(initFirebase, 100);
            }
        }
        initFirebase();
    </script>
    
    <!-- App Script -->
    <script src="app.js"></script>
</body>
</html>
